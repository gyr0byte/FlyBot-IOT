[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybot-contract"
version = "0.1.0"
description = "FlyBot MQTT message contract in code (reads docs/schemas)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[tool.setuptools]
packages = ["flybot_contract"]
