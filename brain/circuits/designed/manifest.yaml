format: 1
name: designed
description: 'Designed circuit: olfactory front end (steps 5.2-5.3: rate-coded receptors,
  projection neurons per side, cross-lateral inhibition) and mushroom body (5.5: Kenyon
  cells with sparse PN and light input, APL feedback inhibition).'
source:
  kind: designed
generator:
  script: brain/tools/make_designed_circuit.py
  seed: 1
designed_parts: All of it. Sizes, wiring and weights are design choices, not connectome
  data.
inputs:
  odour_left:
    group: rl
    encoding: poisson_rate
    base_hz: 2.0
    gain_hz: 150.0
  odour_right:
    group: rr
    encoding: poisson_rate
    base_hz: 2.0
    gain_hz: 150.0
  light:
    group: lgt
    encoding: poisson_rate
    base_hz: 1.0
    gain_hz: 60.0
outputs:
  steer_left:
  - pl
  steer_right:
  - pr
projections:
- name: rl_pl
  pre: rl
  post: pl
  scale: 0.6
- name: rl_ln_l
  pre: rl
  post: ln_l
  scale: 0.4
- name: ln_l_pr
  pre: ln_l
  post: pr
  scale: 0.12
- name: rr_pr
  pre: rr
  post: pr
  scale: 0.6
- name: rr_ln_r
  pre: rr
  post: ln_r
  scale: 0.4
- name: ln_r_pl
  pre: ln_r
  post: pl
  scale: 0.12
- name: pl_kc
  pre: pl
  post: kc
  scale: 0.3
- name: pr_kc
  pre: pr
  post: kc
  scale: 0.3
- name: lgt_kc
  pre: lgt
  post: kc
  scale: 0.8
- name: kc_apl
  pre: kc
  post: apl
  scale: 0.3
- name: apl_kc
  pre: apl
  post: kc
  scale: 2.0
