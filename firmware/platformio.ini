; FlyBot ESP32 firmware (plan Phase 6).
;
; Keep PlatformIO on D: (CLAUDE.md): set PLATFORMIO_CORE_DIR=D:\Tools\platformio before running pio.
;   pio run -e esp32dev                 build the firmware
;   pio run -e esp32dev -t upload       flash it (when the board is connected)
;   pio device monitor                  serial console (115200 baud; type "help")
;   pio test -e native                  unit tests and the Python cross-check vectors on the PC
;                                       (needs a host gcc on PATH; see firmware/README.md)

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -ffp-contract=off                 ; never fuse multiply-adds: the edge port must match Python exactly
    -I include
test_framework = unity

[env:esp32dev]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 on ESP-IDF 4.4 (includes esp-mqtt)
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots (OTA-ready), small SPIFFS (unused); NVS kept
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
test_ignore = *                       ; the unit tests run on the PC (env:native), not on the board

[env:native]
; Host gcc on PATH (tested with MinGW GCC 6.3, 32-bit). The edge library is C++14-clean for it.
; -msse2 -mfpmath=sse: IEEE double arithmetic like Python's (a 32-bit x87 build would use 80-bit
; intermediates and break the bit-exact cross-check).
platform = native@1.2.1
build_flags =
    ${env.build_flags}
    -std=gnu++14
    -msse2
    -mfpmath=sse
    -Wall
    -Wextra
    -DFLYBOT_NATIVE
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_SUPPORT_64
    -DUNITY_DOUBLE_PRECISION=1e-12
test_build_src = no
