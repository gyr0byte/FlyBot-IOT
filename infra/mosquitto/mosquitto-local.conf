# FlyBot development broker: localhost-only mode.
# Same as mosquitto.conf but reachable only from this laptop (simulator, brain, dashboard).
# Use on untrusted networks (e.g. college Wi-Fi). The ESP32 cannot connect in this mode.
# Start it with: infra\start-broker.cmd local

listener 1883 127.0.0.1
protocol mqtt

listener 9001 127.0.0.1
protocol websockets

include_dir infra/mosquitto/conf.d
