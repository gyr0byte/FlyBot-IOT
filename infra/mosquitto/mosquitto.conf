# FlyBot development broker: LAN mode (default).
# Listens on all network interfaces so the ESP32 can reach port 1883 over Wi-Fi.
# Start it with infra\start-broker.cmd, which runs Mosquitto from the repo root.
# All relative paths here and in conf.d are relative to the repo root.
# TLS listeners (8883, 8884) are added in Phase 11 for the cloud broker.

# Plain MQTT: ESP32 and simulator on the local network.
listener 1883
protocol mqtt

# WebSockets: dashboard during development.
listener 9001
protocol websockets

# Shared settings: authentication, ACL, persistence, logging.
include_dir infra/mosquitto/conf.d
