# Settings shared by mosquitto.conf (LAN) and mosquitto-local.conf (localhost).
# Paths are relative to the repo root (start-broker.cmd runs Mosquitto from there).
# Runtime state lives in .local/mosquitto/ (git-ignored, on D:).

# ---- Authentication and access control (contract section 4) ----
allow_anonymous false
# Built from .env by infra/mosquitto/make_passwords.py. Never committed.
password_file .local/mosquitto/passwd
# Generated from the contract by infra/mosquitto/gen_acl.py. Committed.
acl_file infra/mosquitto/acl

# ---- Persistence ----
# Retained messages (status, brain/status, brain/weights and cmd/mode, including a saved
# e-stop) must survive a broker restart (contract section 4.2).
persistence true
persistence_location .local/mosquitto/data/
# Save after every change (retained message, subscription or queued message), not on a
# timer, so an e-stop survives even a crash. The database is tiny in development.
autosave_on_changes true
autosave_interval 1

# ---- Logging ----
log_dest stdout
log_dest file .local/mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
